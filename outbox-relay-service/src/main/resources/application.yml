spring:
  application:
    name: outbox-relay-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: outbox-relay-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.demo.outbox.event
        spring.json.value.default.type: com.demo.outbox.event.OutboxCdcEvent
        # o produtor é o Debezium (Kafka Connect), não outro serviço Spring — não existe
        # header __TypeId__, usa sempre o default.type acima
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # payload já é o JSON pronto gravado na outbox — StringSerializer manda como está,
      # sem reserializar (um JsonSerializer aqui geraria JSON escapado dentro de JSON)
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8084

app:
  kafka:
    topic-outbox-cdc: ledger.public.outbox_event

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.demo.outbox: INFO
